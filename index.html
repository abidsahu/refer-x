<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f7a5c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>میرے ریفر لنکس</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#14231f;--mute:#5d6f69;--line:#dce5e1;--acc:#0f7a5c;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1815;--card:#16241f;--ink:#e8f1ee;--mute:#93a8a1;--line:#263a33;--acc:#3ecf9f;--accink:#06231a}}
:root[data-theme="dark"]{--bg:#0e1815;--card:#16241f;--ink:#e8f1ee;--mute:#93a8a1;--line:#263a33;--acc:#3ecf9f;--accink:#06231a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Naskh Arabic',system-ui,sans-serif;font-size:16px;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:8px 0 12px}
.pv{background:#f6c343;color:#3b2c00;padding:8px 12px;border-radius:10px;margin-bottom:10px;font-size:14px}
input[type=search]{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;font:inherit;font-size:14px;cursor:pointer}
.chips button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.list{display:flex;flex-direction:column;gap:12px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.logo{width:52px;height:52px;border-radius:12px;flex:none;object-fit:cover;background:var(--acc);color:var(--accink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px}
.t{flex:1;min-width:0}.t b{display:block;font-weight:600;font-size:17px}.t p{margin:0;color:var(--mute);font-size:13.5px;line-height:1.5}
.go{flex:none;background:var(--acc);color:var(--accink);border:0;border-radius:10px;padding:8px 14px;font:600 14px 'Noto Naskh Arabic',sans-serif;cursor:pointer}
.cp{flex:none;border:0;background:transparent;color:var(--mute);font:inherit;font-size:13px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.empty{text-align:center;color:var(--mute);padding:48px 12px;border:1.5px dashed var(--line);border-radius:16px}
.viewer{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:9;padding-top:env(safe-area-inset-top,0px)}
.viewer.on{display:flex}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.bar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button,.bar a{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;font:500 14px 'Noto Naskh Arabic',sans-serif;cursor:pointer;text-decoration:none}
iframe{flex:1;border:0;width:100%;background:#fff}
.note{font-size:12.5px;color:var(--mute);padding:6px 12px;background:var(--card);border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;display:none;z-index:20}
</style>
</head>
<body>
<div class="wrap">
  <div class="pv" id="pv" hidden>پیش نظارہ: یہ تبدیلیاں ابھی شائع نہیں ہوئیں۔</div>
  <h1>میرے ریفر لنکس</h1>
  <input type="search" id="q" placeholder="تلاش کریں">
  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>
</div>
<div class="viewer" id="viewer">
  <div class="bar"><button id="back">→ واپس</button><b id="vt"></b><button id="cp">کاپی</button><a id="ext" target="_blank" rel="noopener">براؤزر میں کھولیں</a></div>
  <iframe id="frame" title="ریفر لنک" referrerpolicy="no-referrer"></iframe>
  <div class="note">اگر صفحہ خالی نظر آئے تو اس ویب سائٹ نے ایپ کے اندر کھلنے کی اجازت نہیں دی۔ اوپر "براؤزر میں کھولیں" دبائیں۔</div>
</div>
<div class="toast" id="toast"></div>
<script>
var $=function(i){return document.getElementById(i)},data=[],cat='',preview=/[?&]preview=1/.test(location.search);
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},1800)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(j){var a=(j&&j.items)||[];return a.filter(function(x){return x&&x.active!==false&&x.url}).sort(function(a,b){return (a.order||0)-(b.order||0)})}
function init(){
  if(preview){$('pv').hidden=false;try{data=norm(JSON.parse(localStorage.getItem('adminDraft')))}catch(e){data=[]}render();return}
  fetch('links.json?t='+Date.now()).then(function(r){return r.json()}).then(function(j){data=norm(j);try{localStorage.setItem('linksCache',JSON.stringify(j))}catch(e){}render()})
  .catch(function(){try{data=norm(JSON.parse(localStorage.getItem('linksCache')))}catch(e){data=[]}render()});
}
function render(){
  var cats=[];data.forEach(function(x){if(x.cat&&cats.indexOf(x.cat)<0)cats.push(x.cat)});
  if(cats.indexOf(cat)<0)cat='';
  $('chips').innerHTML=cats.length?['']. concat(cats).map(function(c){return '<button data-c="'+esc(c)+'" class="'+(c===cat?'on':'')+'">'+(c?esc(c):'سب')+'</button>'}).join(''):'';
  var q=$('q').value.trim().toLowerCase();
  var rows=data.filter(function(x){return (!cat||x.cat===cat)&&(!q||((x.name||'')+' '+(x.desc||'')).toLowerCase().indexOf(q)>=0)});
  $('list').innerHTML=rows.length?rows.map(function(x){
    var lg=x.logo?'<img class="logo" alt="" src="'+esc(x.logo)+'">':'<div class="logo">'+esc((x.name||'?').trim().charAt(0).toUpperCase())+'</div>';
    return '<div class="item">'+lg+'<div class="t"><b>'+esc(x.name)+'</b>'+(x.desc?'<p>'+esc(x.desc)+'</p>':'')+'</div><button class="cp" data-c2="'+esc(x.id)+'">کاپی</button><button class="go" data-o="'+esc(x.id)+'">'+esc(x.btn||'کھولیں')+'</button></div>'}).join(''):'<div class="empty">کوئی ریفر لنک نہیں ملا۔</div>';
}
function find(id){return data.filter(function(x){return x.id===id})[0]}
function copy(u){try{navigator.clipboard.writeText(u).then(function(){toast('لنک کاپی ہو گیا')},function(){toast('کاپی نہیں ہوا')})}catch(e){toast('کاپی نہیں ہوا')}}
$('chips').onclick=function(e){var b=e.target.closest('button');if(b){cat=b.dataset.c;render()}};
$('q').oninput=render;
$('list').onclick=function(e){var b=e.target.closest('button');if(!b)return;var it;
  if(b.dataset.o&&(it=find(b.dataset.o))){$('vt').textContent=it.name;$('frame').src=it.url;$('ext').href=it.url;$('viewer').dataset.u=it.url;$('viewer').classList.add('on')}
  else if(b.dataset.c2&&(it=find(b.dataset.c2)))copy(it.url)};
$('back').onclick=function(){$('viewer').classList.remove('on');$('frame').src='about:blank'};
$('cp').onclick=function(){copy($('viewer').dataset.u)};
init();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&!preview){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
</html>
